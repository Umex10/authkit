# Builds the backend Docker image on every push to a non-main branch, so a
# broken image shows up before the code reaches main. Nothing is pushed;
# publishing to ghcr.io happens in a separate workflow on main.
name: docker-ci

on:
  push:
    # main is handled by the publish workflow.
    branches-ignore:
      - main
    # Only run when something the image depends on changes (not apps/web).
    # "**" matches every file in every subfolder.
    paths:
      - "apps/backend/**"
      - ".github/workflows/docker-ci.yml"

# Least privilege: the job only needs to read (check out) the repository.
permissions:
  contents: read

# Controls runs that overlap in time.
concurrency:
  # The name of a queue. Runs with the same group name affect each other,
  # runs with different names run in parallel. github.ref is the branch
  # (e.g. refs/heads/feature/docker), so every branch gets its own queue; the
  # workflow-name prefix keeps this workflow apart from the other workflows
  # running on the same branch.
  group: docker-ci-${{ github.ref }}
  # A newer run in the same group cancels the running one of the older commit.
  cancel-in-progress: true

jobs:
  build-image:
    # A fresh Ubuntu machine per run; Docker is pre-installed, but there is no
    # code, no .m2 and no Docker layer cache on it at the start.
    runs-on: ubuntu-latest
    steps:
      # Clones the commit that triggered the run into the working directory.
      - name: Checkout
        uses: actions/checkout@v7

      # Buildx is Docker's extended builder; unlike plain "docker build" it can
      # store and load layers in an external cache such as the GitHub cache.
      # This step only sets up the tool; reading and writing the cache happens
      # in the build step below.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Utilizes Buildx to build the image from apps/backend/Dockerfile and to
      # read/write the layer cache. Java is not needed on this machine: the
      # Dockerfile builds the jar inside a container from the JDK image.
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          # Build context: the folder sent to Docker; its Dockerfile is used.
          context: apps/backend
          # Only verify that the image builds; do not upload it anywhere.
          push: false
          # Reuse layers from the GitHub Actions cache ("gha") of earlier runs.
          cache-from: type=gha
          # Save the layers back afterwards. mode=max also stores the layers of
          # the build stage (incl. the downloaded Maven dependencies), not only
          # those of the final runtime image.
          cache-to: type=gha,mode=max
