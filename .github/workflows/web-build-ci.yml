# Checks that the Next.js app is clean and builds: lint, type check and the
# production build (next build), on every push to any branch. The unit and e2e
# tests have their own workflows and run in parallel.
name: web-build-ci

on:
  push:
    # No branch filter: the build is checked everywhere, main included.
    # Only run when frontend code or this workflow changes.
    paths:
      - "apps/web/**"
      - ".github/workflows/web-build-ci.yml"
  # "Run workflow" button in the Actions tab to start it by hand.
  workflow_dispatch:

# Least privilege: the job only needs to read the repository.
permissions:
  contents: read

# One queue per branch for this workflow; a newer push cancels the run of the
# older commit (same idea as in backend-verify-ci.yml).
concurrency:
  group: web-build-ci-${{ github.ref }}
  cancel-in-progress: true

# Every "run" step starts in apps/web instead of the repository root, where
# package.json lives.
defaults:
  run:
    working-directory: apps/web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Clones the commit that triggered the run.
      - name: Checkout
        uses: actions/checkout@v7

      # Installs Node.js and caches npm's download folder (~/.npm) between runs.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Current LTS line; quoted so YAML reads it as text.
          node-version: "24"
          # Restores ~/.npm from the GitHub cache at the start and saves it at
          # the end, so packages are not downloaded again on every run.
          cache: npm
          # The cache key is derived from the lockfile: a fresh download only
          # when the dependencies change. Needed because the lockfile is not in
          # the repository root.
          cache-dependency-path: apps/web/package-lock.json

      # Installs exactly the versions from package-lock.json into a fresh
      # node_modules. Unlike "npm install" it never changes the lockfile and
      # fails if it does not match package.json.
      - name: Install dependencies
        run: npm ci

      # ESLint with the Next.js rules (eslint.config.mjs).
      - name: Lint
        run: npm run lint

      # TypeScript only checks the types (tsc --noEmit: no JavaScript output),
      # for every .ts/.tsx file in tsconfig.json, tests and Playwright helpers
      # included. Fails fast with a clear list, before the slower build starts.
      - name: Type check
        run: npm run typecheck

      # The production build, as it would be deployed. Fails on compile errors,
      # type errors in the app code and pages that cannot be prerendered.
      - name: Build
        run: npm run build
        env:
          # Next.js collects anonymous usage data during the build; not wanted
          # on CI machines.
          NEXT_TELEMETRY_DISABLED: "1"
