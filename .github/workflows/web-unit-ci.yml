# Runs the Vitest unit tests of the Next.js app on every push: form rules,
# cookie parsing, the route gate (proxy.ts), the access-token renewal and a few
# components. No servers, no browser, no database. Build/lint and the e2e
# tests have their own workflows.
name: web-unit-ci

on:
  push:
    # No branch filter: the unit tests run everywhere, main included.
    # They only test frontend code, so only frontend changes trigger them.
    paths:
      - "apps/web/**"
      - ".github/workflows/web-unit-ci.yml"
  # "Run workflow" button in the Actions tab to start it by hand.
  workflow_dispatch:

# Least privilege: the job only needs to read the repository.
permissions:
  contents: read

# One queue per branch for this workflow; a newer push cancels the run of the
# older commit (same idea as in backend-verify-ci.yml). The name must differ
# from the other workflows, or they would cancel each other.
concurrency:
  group: web-unit-ci-${{ github.ref }}
  cancel-in-progress: true

# Every "run" step starts in apps/web instead of the repository root, where
# package.json lives.
defaults:
  run:
    working-directory: apps/web

jobs:
  unit:
    runs-on: ubuntu-latest
    # The suite takes seconds; 10 minutes only guards against a hanging run
    # (GitHub's default would be 6 hours).
    timeout-minutes: 10
    steps:
      # Clones the commit that triggered the run.
      - name: Checkout
        uses: actions/checkout@v7

      # Installs Node.js and caches npm's download folder (~/.npm) between runs.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Current LTS line; quoted so YAML reads it as text.
          node-version: "24"
          # Restores ~/.npm from the GitHub cache at the start and saves it at
          # the end, so packages are not downloaded again on every run.
          cache: npm
          # The cache key is derived from the lockfile: a fresh download only
          # when the dependencies change. Needed because the lockfile is not in
          # the repository root.
          cache-dependency-path: apps/web/package-lock.json

      # Installs exactly the versions from package-lock.json into a fresh
      # node_modules. Unlike "npm install" it never changes the lockfile and
      # fails if it does not match package.json.
      - name: Install dependencies
        run: npm ci

      # Runs Vitest once (vitest run). vitest.config.ts writes the results to
      # test-reports/junit.xml as well and, on GitHub, marks failed tests on
      # the run page.
      - name: Unit tests
        run: npm run test:unit

      # Keeps the report as an artifact: a zip attached to this run,
      # downloadable at the bottom of the run page. Without this step the
      # file would be deleted together with the machine.
      - name: Upload Vitest report
        # By default a step only runs if all previous steps succeeded, so it
        # would be skipped after failing tests, exactly when the report matters.
        # !cancelled() runs it after success and after failure, but not when
        # the run was cancelled (e.g. by a newer push, see concurrency above).
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          # Name of the download on the run page.
          name: unit-reports
          # The JUnit XML written by the test step above.
          path: apps/web/test-reports/
          # If the folder is missing (e.g. npm ci failed before the tests ran),
          # stay quiet. The default "warn" would only log a warning; "error"
          # would fail the step. The real cause is already shown above.
          if-no-files-found: ignore
          # Delete the artifact after 14 days to save storage.
          retention-days: 14
