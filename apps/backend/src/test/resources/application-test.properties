# =============================================================================
# AuthKit backend — "test" profile (unit & integration tests)
#
# Activated by @ActiveProfiles("test"). Uses an in-memory H2 database in
# PostgreSQL-compatibility mode so the full test suite runs in seconds with no
# external services. The schema is created and dropped per run.
# =============================================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Dummy signing secret so the JwtService bean (@Value("${jwt.secret}")) can be
# created when the full ApplicationContext is loaded in @SpringBootTest classes.
# Long enough (>= 256 bits) to satisfy the HS256 key requirement.
jwt.secret=dGVzdC1zZWNyZXQtZGVmYXVsdC1qd3Qtc2lnbmluZy1rZXktZm9yLXVuaXQtdGVzdHM=
