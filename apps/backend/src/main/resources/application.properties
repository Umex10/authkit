# =============================================================================
# AuthKit backend — default configuration
#
# Every value below has a sensible default so the service runs straight after a
# clone (`./mvnw spring-boot:run` + the docker-compose Postgres). Anything you
# would change per environment is overridable via an environment variable using
# the ${ENV_VAR:default} syntax — no code or file edits required in production.
# =============================================================================

spring.application.name=authkit-backend

# ---- Database (PostgreSQL — started by the root docker-compose.yml) ----------
# DB_URL / DB_USER / DB_PASSWORD let you point at any Postgres without touching
# this file. The defaults match docker-compose.yml.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/authkit}
spring.datasource.username=${DB_USER:authkit}
spring.datasource.password=${DB_PASSWORD:authkit}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ---------------------------------------------------------
# 'update' auto-creates/updates the schema from the @Entity classes — great for
# getting started. Switch to a migration tool (Flyway/Liquibase) for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---- API ---------------------------------------------------------------------
# Every route is served under this prefix, e.g. POST /api/v1/auth/sign-in.
# The Next.js frontend expects exactly this prefix (see apps/web).
server.servlet.context-path=/api/v1

# ---- Security: JWT signing secret -------------------------------------------
# Dev default below so the service boots out of the box. It is HS256, so the key
# must be >= 256 bits (32 bytes). ALWAYS override it in production:
#   export JWT_SECRET="$(openssl rand -base64 48)"
jwt.secret=${JWT_SECRET:vyHwvufyR5011fbuZ0VqmvuMCGPHwF5hfpzpm5ACNp9MfakocpIaKI8IwcWiI3r5}

# ---- Logging -----------------------------------------------------------------
logging.level.org.springframework.security=INFO
